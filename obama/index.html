<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Obama</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  .frame {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .frame img {
    height: 100vh;
    width: auto;
    max-width: none;
    transform-origin: 61% 33%;
    animation: eyezoom 78s ease-in-out infinite;
  }
  @keyframes eyezoom {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.6); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>
<div class="frame">
  <img src="/globalmedia/Obama.jpg" alt="">
</div>
<audio src="/globalmedia/StarSpangled.mp3" autoplay></audio>
</body>
</html>
